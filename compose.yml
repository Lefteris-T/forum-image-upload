services:
  forum:
    build: .
    container_name: forum

    ports:
      - "8080:8080"

    environment:
      FORUM_ADDRESS: ":8080"
      FORUM_DATABASE_PATH: "/app/data/forum.db"
      FORUM_SESSION_DURATION: "24h"
      FORUM_COOKIE_NAME: "forum_session"
      FORUM_SECURE_COOKIE: "${FORUM_SECURE_COOKIE:-false}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      GITHUB_REDIRECT_URL: "${GITHUB_REDIRECT_URL:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-}"

    volumes:
      - forum-data:/app/data
      - forum-uploads:/app/static/uploads

    restart: unless-stopped
volumes:
  forum-data:
    name: forum-data
  forum-uploads:
    name: forum-uploads
