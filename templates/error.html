<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{{.Status}} — Common Ground</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header class="site-header">
    <nav class="site-nav" aria-label="Main navigation">
        <a class="brand" href="/" aria-label="Common Ground home"><span class="brand-mark" aria-hidden="true">✦</span><span>Common Ground</span></a>
    </nav>
</header>

<main class="page-shell">

    <section
        class="form-card compact"
        aria-labelledby="error-title"
    >

        <h1 id="error-title">
            {{.Status}}
        </h1>

        <h2>
            {{.Message}}
        </h2>

        <p>
            The request could not be completed.
        </p>

        <p>
            <a href="/">
                <strong>← Return home</strong>
            </a>
        </p>

    </section>

</main>

</body>
</html>
